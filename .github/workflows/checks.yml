name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked CPU environment
        run: uv sync --locked --extra cpu --extra dev
      - name: Check Python
        run: |
          uv run --no-sync python -m ruff check src tests
          uv run --no-sync python -m ruff format --check src tests
          uv run --no-sync python -m pytest
          uv pip check
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/fedsim-dist"
      - name: Validate deployment configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use project npm version
        run: |
          npm_package_manager=$(node --print "require('./package.json').packageManager")
          npm install --global "$npm_package_manager"
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build
