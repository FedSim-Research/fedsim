<div
  class="canvas-wrapper"
  appShortcuts
  [activeService]="activeGraph()"
  #shortcuts="appShortcuts"
  #canvasWrapper
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)">
  @if (activeView() === 'editor') {
  <vflow
    [class.shift-selection-mode]="shortcuts.shiftDown"
    [nodes]="renderNodes()"
    [edges]="renderEdges()"
    [entitiesSelectable]="true"
    [elevateEdgesOnSelect]="true"
    [connection]="connectionSettings"
    (connect)="handleConnect($event)"
    (nodesChanges.position)="handleNodePositionChange($event)"
    (edgesChanges.select)="shortcuts.onEdgeSelectionChange($event)"
    view="auto"
    [background]="{ type: 'dots', backgroundColor: 'transparent' }"
    [alignmentHelper]="true">
    <ng-template edgeLabelHtml let-labelContext>
      @let edge = graphEdge(labelContext.edge.id);
      @if (edge) {
        <app-edge-metrics-box
          [edge]="edge"
          [graphService]="activeGraph()"
        ></app-edge-metrics-box>
      }
    </ng-template>
    </vflow>
  <ngx-selecto
    [className]="'selecto-selection'"
    [dragContainer]="canvasWrapper"
    [rootContainer]="canvasWrapper"
    [boundContainer]="canvasWrapper"
    [selectableTargets]="['.canvas-wrapper [data-id]']"
    [selectByClick]="false"
    [selectFromInside]="false"
    [continueSelect]="false"
    [preventDefault]="false"
    [keyContainer]="keyContainer"
    [hitRate]="50"
    (dragStart)="shortcuts.onSelectoDragStart($event)"
    (select)="shortcuts.onSelectoSelect($event)"
    (selectEnd)="shortcuts.onSelectoSelectEnd($event)">
  </ngx-selecto>
  } @else {
  <app-dashboard-view [sidebarOpen]="sidebarOpen()"></app-dashboard-view>
  }
  <app-sidebar
    [shortcuts]="shortcuts"
    [hierflGraphId]="graphIdOf('hierfl')"
    [spykerGraphId]="graphIdOf('spyker')"
    [activeView]="activeView()"
    [activeMode]="activeMode()"
    (resetGraph)="handleReset()"
    (undoRequested)="undo()"
    (redoRequested)="redo()"
    (modeChange)="changeMode($event)"
    (viewChange)="changeView($event)"
    (sidebarOpenChange)="onSidebarOpenChange($event)"
    (graphSelected)="handleGraphSelected($event)"
    (graphDeleted)="handleGraphDeleted($event)"
    (simulationRequested)="handleSimulation($event)">
  </app-sidebar>

  <app-framework-jobs-popup></app-framework-jobs-popup>
</div>
