services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fedsim-prometheus
    ports:
      - "9010:9010"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9010'
    volumes:
      - ../frontend/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - fedsim-network

  loki:
    image: grafana/loki:latest
    container_name: fedsim-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../frontend/loki.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped
    networks:
      - fedsim-network

  grafana:
    image: grafana/grafana:latest
    container_name: fedsim-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBED_INIT_STATE_TOKEN=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ../frontend/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../frontend/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - fedsim-network

networks:
  fedsim-network:
    driver: bridge
