<div class="node-wrapper" [attr.data-id]="node().id">
  <handle type="target" position="top" id="client-in" />
  <handle type="source" position="top" id="client-out" />
  <div class="node-card" (click)="onNodeClick($event)" [class.node-selected]="isSelected()">
    <div class="node-header">
      <div class="node-title">
        <span class="status-dot"></span>
        <span>Client</span>
      </div>
      <button
        class="delete-button"
        type="button"
        [class.delete-button--visible]="showDelete()"
        (click)="onDelete($event)"
        aria-label="Knoten loeschen"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM7 9h2v9H7V9z"
            fill="currentColor"
          />
        </svg>
      </button>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
        <line x1="6" y1="6" x2="6.01" y2="6"></line>
        <line x1="6" y1="18" x2="6.01" y2="18"></line>
      </svg>
    </div>

  <div class="node-body">
        
    <div class="spec-row">
      <span>Clientanzahl</span>
      <span class="spec-value">{{ client().count }}</span>
    </div>
     <div class="spec-row">
      <span>Client type</span>
      <span class="spec-value">{{ client().type || '—' }}</span>
    </div>
     <div class="spec-row">
      <span>Compute factor</span>
      <span class="spec-value">{{ client().computeFactor }}</span>
    </div>
    <div class="spec-row">
      <span>Upload</span>
      <span class="spec-value">{{ client().uploadMbps }} Mbps</span>
    </div>
    <div class="spec-row">
      <span>Download</span>
      <span class="spec-value">{{ client().downloadMbps }} Mbps</span>
    </div>
  </div>
    <div class="node-footer">
      {{ client().environment === 'hierfl' ? 'HIERARCHICAL' : 'SPYKER' }}
    </div>
  </div>
</div>
