<div
  class="edge-card"
  lang="en"
  [class.edge-card--selected]="isSelected"
  (mousedown)="stopPropagation($event)"
  (click)="stopPropagation($event)"
>
  <header class="edge-card__header">
    <span>Edge parameters</span>
  </header>
  <div class="edge-card__body comparison__body">
    <div class="comparison__row">
      <span class="comparison__label">Ping</span>
      <div class="comparison__inputs">
        <input
          class="comparison__value"
          type="text"
          inputmode="decimal"
          pattern="[0-9]*[.,]?[0-9]*"
          [value]="formatMetric('pingMs')"
          (input)="handleInput($event, 'pingMs', 0)"
          (blur)="onBlur()"
          (mousedown)="stopPropagation($event)"
        />
        <span class="comparison__pm">±</span>
        <input
          class="comparison__extra"
          type="text"
          inputmode="decimal"
          pattern="[0-9]*[.,]?[0-9]*"
          [value]="formatMetric('jitterMs')"
          (input)="handleInput($event, 'jitterMs', 0)"
          (blur)="onBlur()"
          (mousedown)="stopPropagation($event)"
        />
      </div>
    </div>
    <div class="comparison__row">
      <span class="comparison__label">Pktloss</span>
      <div class="comparison__inputs">
        <input
          class="comparison__value"
          type="text"
          inputmode="decimal"
          pattern="[0-9]*[.,]?[0-9]*"
          [value]="formatMetric('packetloss')"
          (input)="handleInput($event, 'packetloss', 0, 1)"
          (blur)="onBlur()"
          (mousedown)="stopPropagation($event)"
        />
        <span class="comparison__pm">±</span>
        <input
          class="comparison__extra"
          type="text"
          inputmode="decimal"
          pattern="[0-9]*[.,]?[0-9]*"
          [value]="formatMetric('packetlossStddev')"
          (input)="handleInput($event, 'packetlossStddev', 0, 1)"
          (blur)="onBlur()"
          (mousedown)="stopPropagation($event)"
        />
      </div>
    </div>
  </div>
</div>
