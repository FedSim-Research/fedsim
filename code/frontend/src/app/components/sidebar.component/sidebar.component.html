@if (!isOpen) {
<button class="sidebar-fab" type="button" (click)="openSidebar()" aria-label="Open sidebar">
  <span class="fab-icon"></span>
</button>
}

<aside class="sidebar" [class.sidebar--closed]="!isOpen">
  <header class="sidebar__header">
    <div class="brand">
      <div class="brand__text">
        <div class="brand__title">FedSim</div>
        <div class="brand__subtitle">Configurator</div>
      </div>
    </div>

    <button class="icon-btn" (click)="openViewGraphsDialog()" aria-label="Open settings">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: block; margin: auto;"
      >
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </svg>
    </button>

    <button class="icon-btn" (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode ? 'Switch to Light' : 'Switch to Dark'">
      @if (isDarkMode) {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      }
    </button>

    <button class="icon-btn" type="button" (click)="closeSidebar()" aria-label="Close sidebar">
      <span class="icon-chevron-left"></span>
    </button>
  </header>

  <div class="content">
    <div class="block">
      <div class="block__title">Architecture Mode</div>
      <div class="mode-tabs">
        <button type="button" class="mode-tab" [class.active]="!selectedArchitectures.spyker"
          (click)="setArchitecture(false)">
          Hierarchical
        </button>
        <button type="button" class="mode-tab" [class.active]="selectedArchitectures.spyker"
          (click)="setArchitecture(true)">
          Spyker
        </button>
      </div>
    </div>

    <div class="rightpane__header">
      <div class="rightpane__subtitle">Configuration</div>
    </div>

    <details class="disclosure">
      <summary class="disclosure__summary">
        <span>Simulation Settings</span>
      </summary>
      <div class="disclosure__body">
        <div class="grid">
          <label class="field">
            <span>Epochs</span>
            <input type="number" min="1" [(ngModel)]="simulationSettings.epochs" />
          </label>
          <label class="field">
            <span>Learning rate</span>
            <input type="number" step="0.0001" min="0" [(ngModel)]="simulationSettings.lr" />
          </label>
          <label class="field">
            <span>Time limit (s)</span>
            <input type="number" min="1" step="1" [(ngModel)]="simulationSettings.runTimeLimit" />
          </label>
        </div>
        <label class="field">
          <span>Output filename</span>
          <input type="text" [(ngModel)]="simulationSettings.outputFilename" />
        </label>
        <label class="field checkbox">
          <input type="checkbox" [(ngModel)]="simulationSettings.evaluateModel" />
          <span>Evaluate after run</span>
        </label>
      </div>
    </details>

    <div class="tooltip-wrapper" [title]="selectedArchitectures.spyker ? 'Not available in Spyker' : ''">
      <details #supDetails class="disclosure" [class.disclosure--disabled]="selectedArchitectures.spyker">
        <summary class="disclosure__summary" (click)="onSuperServerSummaryClick($event)">
          <span>Super Server</span>
        </summary>
        <div class="disclosure__body">
          <label class="field">
            <span>Name</span>
            <input type="text" [(ngModel)]="configDraft.superserver.name" placeholder="Name" />
          </label>
          <div class="grid">
            <label class="field">
              <span>Compute factor</span>
              <input type="number" min="0" step="0.1" [(ngModel)]="configDraft.superserver.computeFactor" />
            </label>
          </div>
          <div class="grid">
            <label class="field">
              <span>Upload (Mbps)</span>
              <input type="number" min="0" [(ngModel)]="configDraft.superserver.uploadMbps" />
            </label>
            <label class="field">
              <span>Download (Mbps)</span>
              <input type="number" min="0" [(ngModel)]="configDraft.superserver.downloadMbps" />
            </label>
          </div>
          <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'SuperServerNode')">
            Drag Super Server
          </div>
        </div>
      </details>
    </div>

    <details class="disclosure">
      <summary class="disclosure__summary">
        <span>Server Nodes</span>
      </summary>
      <div class="disclosure__body">
        <label class="field">
          <span>Name</span>
          <input type="text" [(ngModel)]="configDraft.server.name" />
        </label>
        <div class="grid">
          <label class="field">
            <span>Compute factor</span>
            <input type="number" min="0" step="0.1" [(ngModel)]="configDraft.server.computeFactor" />
          </label>
        </div>
        <div class="grid">
          <label class="field">
            <span>Upload (Mbps)</span>
            <input type="number" min="0" [(ngModel)]="configDraft.server.uploadMbps" />
          </label>
          <label class="field">
            <span>Download (Mbps)</span>
            <input type="number" min="0" [(ngModel)]="configDraft.server.downloadMbps" />
          </label>
        </div>
        <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'ServerNode')">
          Drag Server Node
        </div>
      </div>
    </details>

    <details class="disclosure">
      <summary class="disclosure__summary">
        <span>Client Nodes</span>
      </summary>
      <div class="disclosure__body">
        <label class="field">
          <span>Client type</span>
          <select [(ngModel)]="configDraft.client.type">
            <option value="laptop">Laptop</option>
            <option value="workstation">Workingstation</option>
            <option value="mobile">Mobile</option>
          </select>
        </label>
        <div class="grid">
          <label class="field">
            <span>Number of clients</span>
            <input type="number" min="1" [(ngModel)]="configDraft.client.count" />
          </label>
          <label class="field">
            <span>Compute factor</span>
            <input type="number" min="0" step="0.1" [(ngModel)]="configDraft.client.computeFactor" />
          </label>
        </div>
        <div class="grid">
          <label class="field">
            <span>Upload (Mbps)</span>
            <input type="number" min="0" [(ngModel)]="configDraft.client.uploadMbps" />
          </label>
          <label class="field">
            <span>Download (Mbps)</span>
            <input type="number" min="0" [(ngModel)]="configDraft.client.downloadMbps" />
          </label>
        </div>
        <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'ClientNode')">
          Drag Client Node
        </div>
      </div>
    </details>
  </div>

  <footer class="sidebar__footer">
    <div class="footer__info footer__info--expand">
      <button class="cta" cta--secondary type="button" (click)="undo()">Undo</button>
      <button class="cta" cta--secondary type="button" (click)="redo()">Redo</button>
    </div>
    <button class="cta" type="button" (click)="openSimulationpopup()">Start simulation</button>
    <app-reset-button (reset)="onResetRequested()"></app-reset-button>
  </footer>
</aside>

@if (showViewGraphsDialog) {
<app-view-graphs-dialog
  [isDarkMode]="isDarkMode"
  [shortcuts]="shortcuts"
  [activeMode]="selectedArchitectures.spyker ? 'spyker' : 'hierfl'"
  (modeRequested)="setArchitecture($event === 'spyker')"
  (graphSelected)="onGraphSelected($event)"
  (close)="closeViewGraphsDialog()"></app-view-graphs-dialog>
}
<p-toast position="top-right" />
<p-confirmDialog styleClass="reset-confirm" />

@if (showSimulationpopup) {
<app-start-popup (close)="closeSimulationpopup()" (run)="runSimulation($event)"> </app-start-popup>
}
