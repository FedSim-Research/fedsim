  [style]="{ width: '2000px', maxWidth: '90vw', height: '80vh', maxHeight: '90vh' }"

      <h2>Getting Started</h2>
      <p>Das ist ein Bespiel wie es am Ende aussehen könnte.</p>

    <section class="help-section">
      <h2>Bulletpoints</h2>
      <ul>
        <li>1.</li>

        <li>3.</li>
