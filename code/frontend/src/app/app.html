<div class="canvas-wrapper" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
  <vflow
    [nodes]="nodes"
    [edges]="edges"
    view="auto"
    [background]="{ type: 'dots', backgroundColor: 'transparent' }" 
    [alignmentHelper]="true"
  >
    <mini-map />
  </vflow>

  <app-sidebar (resetGraph)="handleReset()"></app-sidebar>
</div>
