<div class="canvas-wrapper" (dragover)="onDragOver($event)" (drop)="onDrop($event)" (mousedown)="onCanvasMouseDown($event)">
  <vflow
    [nodes]="nodes"
    [edges]="edges"
    [connection]="connectionModel"
    [entitiesSelectable]="true"
    [elevateEdgesOnSelect]="true"
    (onConnect)="handleConnect($event)"
    view="auto"
    [background]="{ type: 'dots', backgroundColor: 'transparent' }" 
    [alignmentHelper]="true"
    (onNodesChange.position)="onNodePositionChange($event)"
  >
  </vflow>

  <div
    *ngIf="selectionBox.visible"
    class="selection-box"
    [style.left.px]="selectionBox.left"
    [style.top.px]="selectionBox.top"
    [style.width.px]="selectionBox.width"
    [style.height.px]="selectionBox.height"
  ></div>

  <app-sidebar
    (resetGraph)="handleReset()"
    (undoRequested)="undo()"
    (redoRequested)="redo()"
    (modeChange)="onModeChange($event)"
  >
  </app-sidebar>
</div>
