@if (!isOpen) {
  <button class="sidebar-fab" type="button" (click)="openSidebar()" aria-label="Open sidebar">
    <span class="fab-icon"></span>
  </button>
}

<aside class="sidebar" [class.sidebar--closed]="!isOpen">
  <header class="sidebar__header">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true"></div>
      <div class="brand__text">
        <div class="brand__title">FedSim</div>
        <div class="brand__subtitle">Configurator</div>
      </div>
    </div>

    <button class="icon-btn" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to Light' : 'Switch to Dark'">
      @if (isDarkMode) {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>

    <button class="icon-btn" type="button" (click)="closeSidebar()" aria-label="Close sidebar">
      <span class="icon-chevron-left"></span>
    </button>
  </header>

  <div class="content">
    
    <div class="block">
      <div class="block__title">Compare</div>
      <div class="checkbox-row">
        <label class="check">
          <input type="checkbox" [(ngModel)]="selectedArchitectures.spyker" />
          <span>Spyker</span>
        </label>
        <label class="check">
          <input type="checkbox" [(ngModel)]="selectedArchitectures.hierfl" />
          <span>Hierarchical</span>
        </label>
      </div>
    </div>

    <div class="rightpane__header">
      <div class="rightpane__subtitle">Konfiguration</div>
    </div>

    <details class="disclosure" [class.disclosure--disabled]="selectedArchitectures.spyker">
      <summary class="disclosure__summary">
        <span>Super Server</span>
      </summary>
      <div class="disclosure__body">
        <label class="field">
          <span>Name</span>
          <input type="text" [(ngModel)]="configDraft.superserver.name" placeholder="Name">
        </label>
        <label class="field">
          <span>ID</span>
          <input type="text" [(ngModel)]="configDraft.superserver.id" placeholder="ID">
        </label>
        <div class="grid">
          <label class="field">
            <span>CPU</span>
            <input type="number" min="1" [(ngModel)]="configDraft.superserver.cpus">
          </label>
          <label class="field">
            <span>GPU</span>
            <input type="number" min="0" [(ngModel)]="configDraft.superserver.gpus">
          </label>
        </div>
        <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'SuperServerNode')">
          Drag Super Server
        </div>
      </div>
    </details>

    <details class="disclosure">
      <summary class="disclosure__summary">
        <span>Server Nodes</span>
      </summary>
      <div class="disclosure__body">
        <label class="field">
          <span>Name</span>
          <input type="text" [(ngModel)]="configDraft.server.name">
        </label>
        <div class="grid">
          <label class="field">
            <span>CPU</span>
            <input type="number" min="1" [(ngModel)]="configDraft.server.cpus">
          </label>
          <label class="field">
            <span>GPU</span>
            <input type="number" min="0" [(ngModel)]="configDraft.server.gpus">
          </label>
        </div>
        <label class="field">
          <span>Rechenzeit (ms)</span>
          <input type="number" min="0" [(ngModel)]="configDraft.server.computeTimeMs">
        </label>
        <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'ServerNode')">
          Drag Server Node
        </div>
      </div>
    </details>

    <details class="disclosure">
      <summary class="disclosure__summary">
        <span>Client Nodes</span>
      </summary>
      <div class="disclosure__body">
        <label class="field">
          <span>ID</span>
          <input type="text" [(ngModel)]="configDraft.client.id">
        </label>
        <div class="grid">
          <label class="field">
            <span>Clientanzahl</span>
            <input type="number" min="1" [(ngModel)]="configDraft.client.count">
          </label>
          <label class="field">
            <span>Ping (ms)</span>
            <input type="number" min="0" [(ngModel)]="configDraft.client.pingMs">
          </label>
        </div>
        <label class="field">
          <span>Clientart</span>
          <select [(ngModel)]="configDraft.client.type">
            <option value="laptop">Laptop</option>
            <option value="workstation">Workingstation</option>
            <option value="mobile">Mobile</option>
          </select>
        </label>
        <label class="field">
          <span>Rechenzeit (ms)</span>
          <input type="number" min="0" [(ngModel)]="configDraft.client.computeTimeMs">
        </label>
        <label class="field">
          <span>Packetloss</span>
          <input type="number" step="0.001" min="0" max="1" [(ngModel)]="configDraft.client.packetloss">
        </label>
        <div class="drag" draggable="true" (dragstart)="onDragStart($event, 'ClientNode')">
          Drag Client Node
        </div>
      </div>
    </details>
  </div>

  <footer class="sidebar__footer">
    <button class="cta" type="button" (click)="openSimulationpopup()">Start simulation</button>
    <button class="cta cta--secondary" type="button">Reset graph</button>
  </footer>
</aside>

@if (showSimulationpopup) {
<div class="popup-backdrop" (click)="closeSimulationpopup()">
  <div class="popup-card" (click)="$event.stopPropagation()">
    
    <div class="popup-header">
      <h3>Simulation starten</h3>
      <button class="icon-btn-small" (click)="closeSimulationpopup()">✕</button>
    </div>

    <div class="popup-body">
      <p>Welches Environment wollen Sie berechnen?</p>
      
      <div class="popup-actions">
        <button class="cta-option" (click)="runSimulation('spyker')">
          <span class="dot spyker-dot"></span>
          1. Spyker
        </button>
        
        <button class="cta-option" (click)="runSimulation('hierarchical')">
          <span class="dot hier-dot"></span>
          2. Hierarchical
        </button>
        
        <button class="cta-option both" (click)="runSimulation('both')">
          <div class="dots-wrapper">
            <span class="dot both-dot"></span>
          </div>
          3. Spyker & Hierarchical
        </button>
      </div>
    </div>
  </div>
</div>
}
