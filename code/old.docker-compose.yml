services:
  ray:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fedsim-ray-deploy
    command: >
      bash -lc "ray start --head --port=6379 --ray-client-server-port=10001 --metrics-export-port=8080 --include-dashboard=true --dashboard-host=0.0.0.0 --dashboard-port=8265 --disable-usage-stats --block"
    environment:
      - HF_HOME=/hf-cache
      - HF_DATASETS_CACHE=/hf-cache/datasets
      - TRANSFORMERS_CACHE=/hf-cache/transformers
      - PYTHONPATH=/app/framework/impl:/app
    volumes:
      - ./data:/app/data
      - ray_logs:/tmp/ray
      - ./hf-cache:/hf-cache
    restart: unless-stopped
    networks:
      - fedsim-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fedsim-backend-deploy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - RAY_ADDRESS=ray://ray:10001
      - PYTHONUNBUFFERED=1
      - HF_HOME=/hf-cache
      - HF_DATASETS_CACHE=/hf-cache/datasets
      - TRANSFORMERS_CACHE=/hf-cache/transformers
      - FEDSIM_GRAFANA_INTERNAL_BASE_URL=http://grafana:3000
    volumes:
      - ./data:/app/data
      - ./backend/db:/app/backend/db
      - ./hf-cache:/hf-cache
    depends_on:
      - ray
    restart: unless-stopped
    networks:
      - fedsim-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fedsim-frontend-deploy
    command: npm run start -- --host 0.0.0.0 --port 4200
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fedsim-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fedsim-prometheus-deploy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9010'
    volumes:
      - ./monitoring-configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ray
    restart: unless-stopped
    networks:
      - fedsim-network

  loki:
    image: grafana/loki:latest
    container_name: fedsim-loki-deploy
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring-configs/loki.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped
    networks:
      - fedsim-network

  alloy:
    image: grafana/alloy:latest
    container_name: fedsim-alloy-deploy
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring-configs/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - ray_logs:/ray-logs:ro
    depends_on:
      - loki
      - ray
    restart: unless-stopped
    networks:
      - fedsim-network

  grafana:
    image: grafana/grafana:latest
    container_name: fedsim-grafana-deploy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBED_INIT_STATE_TOKEN=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:8088/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring-configs/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./frontend/grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - fedsim-network

  nginx:
    image: nginx:1.27-alpine
    container_name: fedsim-nginx-deploy
    ports:
      - "${DEPLOY_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ray
      - prometheus
      - grafana
    restart: unless-stopped
    networks:
      - fedsim-network

networks:
  fedsim-network:
    driver: bridge

volumes:
  ray_logs:
